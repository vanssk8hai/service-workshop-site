<script>'use strict';
const $=s=>document.querySelector(s);
function localUUID(){if(typeof crypto.randomUUID==='function')return crypto.randomUUID();const bytes=crypto.getRandomValues(new Uint8Array(16));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;const hex=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');return hex.slice(0,8)+'-'+hex.slice(8,12)+'-'+hex.slice(12,16)+'-'+hex.slice(16,20)+'-'+hex.slice(20);}

const TABS=[['*','Все'],['Р','В ремонте'],['Г','Готовы к выдаче'],['С','На согласовании'],['О','Ждут запчасти'],['Б','Без ремонта'],['В','Выданы']];
const names=Object.fromEntries(TABS);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
function nowS(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;}
const today=()=>nowS().slice(0,10);
function updateClock(){const d=new Date();$('#today').textContent=d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})+' · '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',hour12:false});}
function dateIn(n){const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
const fd=s=>/^\d{4}-\d{2}-\d{2}/.test(s||'')?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(0,4):String(s||'');
const fdt=s=>s?fd(s)+(String(s).length>10?' · '+String(s).slice(11):''):'';
const dateCell=s=>s?`${esc(fd(s))}<div class="muted num">${esc(String(s).slice(11))||'Время не указано'}</div>`:'—';
function masterKey(name){return String(name||'').trim();}
function masterName(name){const key=masterKey(name);return SETTINGS.masters.find(m=>m.id===key)?.name||name||'';}
function masterOptions(value){const options=[['','Не назначен'],...SETTINGS.masters.filter(m=>!m.retired).map(m=>[m.id,m.name])];if(value&&!options.some(([v])=>v===value)){const key=masterKey(value),known=options.findIndex(([v])=>v===key);if(known>=0)options[known]=[value,masterName(value)];else options.push([value,masterName(value)+' (из архива)']);}return options.map(([v,label])=>`<option value="${esc(v)}" ${v===(value||'')?'selected':''}>${esc(label)}</option>`).join('');}
const money=n=>Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽';
const total=x=>Math.round(((Number(x.ws)||0)+(Number(x.ps)||0))*100)/100;
const active=x=>['Р','С','О'].includes(x.s);
const overdue=x=>active(x)&&/^\d{4}-\d{2}-\d{2}$/.test(x.d||'')&&x.d<today();
const clone=x=>JSON.parse(JSON.stringify(x));
const DEFAULT_SETTINGS={title:'Мастерская',subtitle:'Без интернета · Учёт ремонта техники',defaultTab:'Р',rowColors:true,backupReminder:true,repairDays:30,pickupDays:14,printTitle:'Ремонт и обслуживание техники',executor:'',address:'',phone:'',details:'',masters:[]};
function validateSettings(raw){
 if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('Неверный формат настроек.');
 const result=JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
 for(const key of ['title','subtitle','printTitle','executor','address','phone','details']){if(raw[key]!==undefined){if(typeof raw[key]!=='string'||raw[key].length>500)throw Error('Некорректное поле настроек: '+key);result[key]=raw[key].trim();}}
 if(!result.title)throw Error('Укажите название программы.');
 if(raw.defaultTab!==undefined){if(!TABS.some(([s])=>s===raw.defaultTab))throw Error('Неизвестная начальная вкладка.');result.defaultTab=raw.defaultTab;}
 if(raw.rowColors!==undefined){if(typeof raw.rowColors!=='boolean')throw Error('Неверная настройка цвета строк.');result.rowColors=raw.rowColors;}
 if(raw.backupReminder!==undefined){if(typeof raw.backupReminder!=='boolean')throw Error('Некорректная настройка напоминаний.');result.backupReminder=raw.backupReminder;}
 for(const key of ['repairDays','pickupDays']){if(raw[key]!==undefined){if(!Number.isInteger(raw[key])||raw[key]<1||raw[key]>3650)throw Error('Сроки контроля должны быть целыми числами от 1 до 3650 дней.');result[key]=raw[key];}}
 if(raw.masters!==undefined){
  if(!Array.isArray(raw.masters)||raw.masters.length>200)throw Error('Некорректный список мастеров.');
  const ids=new Set(),labels=new Set();result.masters=raw.masters.map(m=>{if(!m||typeof m.id!=='string'||!m.id||m.id.length>100||ids.has(m.id)||typeof m.name!=='string'||!m.name.trim()||m.name.length>100||typeof m.retired!=='boolean')throw Error('Проверьте имена мастеров.');const name=m.name.trim(),key=name.toLocaleLowerCase('ru-RU');if(labels.has(key))throw Error('Имена мастеров не должны повторяться.');ids.add(m.id);labels.add(key);return {id:m.id,name,retired:m.retired};});
 }
 return result;
}
let SETTINGS=validateSettings(JSON.parse($('#settings-seed')?.textContent||'{}'));
function readSettings(){return new Promise((resolve,reject)=>{const r=idb.transaction('meta').objectStore('meta').get('settings');r.onsuccess=()=>{try{resolve(validateSettings(r.result||SETTINGS));}catch(e){reject(e);}};r.onerror=()=>reject(r.error);});}
function applySettings(){
 document.querySelector('header h1').textContent=SETTINGS.title;document.querySelector('header .sub').textContent=SETTINGS.subtitle;document.querySelector('header .mark').textContent=SETTINGS.title.charAt(0).toLocaleUpperCase('ru-RU');document.title=SETTINGS.title;
 document.body.classList.toggle('plain-rows',!SETTINGS.rowColors);renderBackupReminder();
}
async function saveSettings(next,expected){await authorizeLocal('owner');return new Promise((resolve,reject)=>{const tx=idb.transaction('meta','readwrite'),store=tx.objectStore('meta');let reason='';const r=store.get('settings');r.onsuccess=()=>{if(JSON.stringify(r.result)!==JSON.stringify(expected)){reason='Настройки изменились в другой вкладке. Закройте настройки и откройте снова.';tx.abort();return;}store.put(next,'settings');};tx.oncomplete=resolve;tx.onerror=tx.onabort=()=>reject(Error(reason||'Не удалось сохранить настройки. Изменения остались в форме.'));});}
function settingsDialog(){requireOwner();
 const original=clone(SETTINGS),draft=clone(SETTINGS);
 showDialog(`<div class="dialog-head"><h2 id="dialog-title">Настройки программы</h2><button id="xc" class="close" aria-label="Закрыть">×</button></div><form id="settings-form"><div class="settings-tabs" role="tablist" aria-label="Разделы настроек">${[['shop','Мастерская'],['masters','Мастера'],['journal','Журнал'],['act','Акт работ'],['cleanup','Удаление заказов']].map(([id,name],i)=>`<button type="button" role="tab" id="tab-${id}" aria-controls="settings-${id}" aria-selected="${i===0}" tabindex="${i===0?0:-1}" data-settings-tab="${id}">${name}</button>`).join('')}</div><div class="dialog-body"><div id="settings-error" class="error hidden" role="alert"></div>
 <section id="settings-shop" role="tabpanel" aria-labelledby="tab-shop"><div class="grid">${F('Название вверху программы','st-title',draft.title,'text','full')}${F('Подпись под названием','st-subtitle',draft.subtitle,'text','full')}</div><p class="help">Можно указать своё название мастерской. Изменится также название вкладки браузера.</p></section>
 <section id="settings-masters" role="tabpanel" aria-labelledby="tab-masters" hidden><p class="help">Имя можно изменить прямо в поле. «Убрать» скрывает мастера из выбора для новых заказов. Старые заказы сохраняются.</p><div id="settings-master-list"></div><button type="button" id="add-master">＋ Добавить мастера</button></section>
 <section id="settings-journal" role="tabpanel" aria-labelledby="tab-journal" hidden><label>Какая вкладка открывается при запуске<select id="st-defaultTab">${TABS.map(([s,label])=>`<option value="${s}" ${s===draft.defaultTab?'selected':''}>${label}</option>`).join('')}</select></label><label class="check settings-check"><input type="checkbox" id="st-rowColors" ${draft.rowColors?'checked':''}>Окрашивать всю строку по статусу заказа</label><label class="check settings-check"><input type="checkbox" id="st-backupReminder" ${draft.backupReminder?'checked':''}>Напоминать о резервной копии каждый день</label><div class="grid">${F('Контроль: дней в работе','st-repairDays',draft.repairDays,'number')}${F('Контроль: дней до получения','st-pickupDays',draft.pickupDays,'number')}</div><p class="help">Целые числа от 1 до 3650. Эти сроки используются в списке залежавшейся техники.</p></section>
 <section id="settings-act" role="tabpanel" aria-labelledby="tab-act" hidden><div class="grid">${F('Надпись над заголовком акта','st-printTitle',draft.printTitle,'text','full')}${F('Адрес мастерской','st-address',draft.address,'text','full')}${F('Исполнитель (имя / организация)','st-executor',draft.executor)}${F('Телефон исполнителя','st-phone',draft.phone,'tel')}${F('Дополнительные реквизиты','st-details',draft.details,'text','full')}</div><p class="help">Эти данные подставляются при печати новых актов. Пустые поля исполнителя и телефона остаются линиями для заполнения от руки.</p></section>
 <section id="settings-cleanup" role="tabpanel" aria-labelledby="tab-cleanup" hidden><p class="help">Найдите старые заказы по дате и статусу, отметьте отдельные записи или все найденные и удалите их из базы. Перед удалением будет скачана резервная копия.</p><button type="button" id="open-cleanup" class="danger">Выбрать заказы для удаления</button></section>

 </div><div class="dialog-actions"><button type="button" id="settings-cancel">Отмена</button><span class="spacer"></span><button type="submit" class="primary" id="settings-save">Сохранить настройки</button></div></form>`,'settings-dialog');
 const collect=()=>validateSettings({...draft,...Object.fromEntries(['title','subtitle','printTitle','address','executor','phone','details'].map(key=>[key,$('#st-'+key).value])),defaultTab:$('#st-defaultTab').value,rowColors:$('#st-rowColors').checked,backupReminder:$('#st-backupReminder').checked,repairDays:Number($('#st-repairDays').value),pickupDays:Number($('#st-pickupDays').value)});
 const snapshot=()=>JSON.stringify({fields:[...$('#settings-form').querySelectorAll('input,select')].map(e=>[e.id,e.type==='checkbox'?e.checked:e.value]),masters:draft.masters});
 function drawMasters(){
  $('#settings-master-list').innerHTML=draft.masters.map((m,i)=>`<div class="settings-master ${m.retired?'retired':''}"><label>Имя мастера${m.retired?' · убран из выбора':''}<input data-master-name="${i}" aria-label="Имя мастера ${i+1}" maxlength="100" value="${esc(m.name)}"></label><button type="button" data-master-toggle="${i}">${m.retired?'Вернуть':'Убрать'}</button></div>`).join('');
 }
 drawMasters();const initial=snapshot();dirtyCheck=()=>snapshot()!==initial;closing=()=>!dirtyCheck()||confirm('В настройках есть несохранённые изменения. Закрыть без сохранения?');
 $('#settings-cancel').onclick=()=>closeDialog();
 $('#open-cleanup').onclick=()=>{if(busy||!loaded||!idb)return;if(closing&&!closing())return;closeDialog(true);cleanupDialog();};

function previousClients(records,exclude){
 const clients=new Map();
 for(const x of records.filter(x=>x.k!==exclude).slice().sort((a,b)=>String(b.n||'').localeCompare(String(a.n||''))||b.k-a.k)){
  const name=String(x.c||'').trim(),phone=String(x.t||'').trim(),address=String(x.a||'').trim();
  const pn=clientPhone(phone),nn=clientName(name);
  if(pn.length<5&&!/[a-zа-я]/i.test(nn))continue;
  const key=JSON.stringify([nn,pn]);
  if(!clients.has(key))clients.set(key,{name,phone,address,pn,nn});
  else if(!clients.get(key).address&&address)clients.get(key).address=address;
 }
 return [...clients.values()];
}

 for(const order of expected){const request=store.get(order.k);request.onsuccess=()=>{if(JSON.stringify(request.result)!==JSON.stringify(order)){reason='Выбранный заказ изменён или удалён в другой вкладке. Откройте список заново и повторите выбор.';tx.abort();return;}store.delete(order.k);};}
 tx.oncomplete=()=>resolve(expected.length);tx.onerror=tx.onabort=()=>reject(new Error(reason||'Удалить заказы не удалось. Изменения отменены.'));
});}
function cleanupMatches(order,{query='',status='*',before=''}){

}
async function cleanupDialog(){requireOwner();
 try{await refresh();}catch(e){showError(e.message);return;}
 const snapshot=clone(DB),selected=new Set();let limit=100;
 showDialog(`<div class="dialog-head"><h2 id="dialog-title">Удаление заказов</h2><button id="xc" class="close" aria-label="Закрыть">×</button></div><div class="dialog-body"><p class="help">Отметьте ненужные заказы галочками. Удаление убирает их из всех вкладок и истории. Перед удалением программа скачает полную резервную копию базы.</p><div id="cleanup-error" class="error hidden" role="alert"></div><div class="grid"><label class="full">Поиск по номеру, технике, клиенту или телефону<input id="cleanup-query" type="search"></label><label>Статус<select id="cleanup-status">${TABS.map(([s,label])=>`<option value="${s}">${label}</option>`).join('')}</select></label><label>Приняты раньше даты (не включая её)<input id="cleanup-before" type="date"></label></div><p class="help">При смене фильтров выбор сбрасывается.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="cleanup-all">Выбрать все найденные</button><button id="cleanup-clear">Снять выбор</button></div><p id="cleanup-count" aria-live="polite"></p><div class="table-wrap"><table><thead><tr><th>Выбор</th><th>Заказ</th><th>Принят</th><th>Техника</th><th>Клиент</th><th>Статус</th></tr></thead><tbody id="cleanup-rows"></tbody></table></div><button id="cleanup-more">Показать ещё 100</button></div><div class="dialog-actions"><button id="cleanup-close">Закрыть</button><span class="spacer"></span><button class="danger" id="cleanup-delete" disabled>Удалить выбранные</button></div>`);
 const filtered=()=>snapshot.filter(o=>cleanupMatches(o,{query:$('#cleanup-query').value.trim(),status:$('#cleanup-status').value,before:$('#cleanup-before').value})).sort((a,b)=>b.k-a.k);
 function count(){const n=filtered().length;$('#cleanup-count').textContent=`Найдено: ${n}. Выбрано: ${selected.size}.`;$('#cleanup-delete').disabled=!selected.size;$('#cleanup-delete').textContent=`Удалить выбранные (${selected.size})`;}
 function draw(){const rows=filtered();$('#cleanup-rows').innerHTML=rows.slice(0,limit).map(o=>`<tr><td><input style="width:auto" type="checkbox" data-delete-id="${o.k}" aria-label="Выбрать заказ №${o.k}" ${selected.has(o.k)?'checked':''}></td><td>№${o.k}</td><td>${esc(fd(o.n))}</td><td>${esc(o.m||'—')}</td><td>${esc(o.c||'—')}</td><td>${esc(names[o.s])}</td></tr>`).join('')||'<tr><td colspan="6">Заказов по этим условиям нет.</td></tr>';$('#cleanup-more').hidden=rows.length<=limit;count();}
 for(const id of ['cleanup-query','cleanup-status','cleanup-before'])$('#'+id).oninput=()=>{selected.clear();limit=100;draw();};
 $('#cleanup-rows').onchange=e=>{if(!e.target.matches('[data-delete-id]'))return;const k=Number(e.target.dataset.deleteId);e.target.checked?selected.add(k):selected.delete(k);count();};
 $('#cleanup-all').onclick=()=>{filtered().forEach(o=>selected.add(o.k));draw();};
 $('#cleanup-clear').onclick=()=>{selected.clear();draw();};
 $('#cleanup-more').onclick=()=>{limit+=100;draw();};
 $('#cleanup-close').onclick=()=>closeDialog();
 closing=()=>!selected.size||confirm('Закрыть список? Выбранные заказы ещё не удалены.');dirtyCheck=()=>selected.size>0;
 $('#cleanup-delete').onclick=async()=>{
  if(busy||!selected.size)return;const orders=snapshot.filter(o=>selected.has(o.k));
  if(!confirm(`Полностью удалить выбранные заказы: ${orders.length}? Они исчезнут из всех вкладок. Перед удалением будет скачана резервная копия.`))return;
  const panel=$('#dlg');busy=true;panel.querySelectorAll('button,input,select').forEach(el=>el.disabled=true);
  let deleted=false;
  try{const current=await getAll(idb,'orders'),map=new Map(current.map(o=>[o.k,o]));if(orders.some(o=>JSON.stringify(map.get(o.k))!==JSON.stringify(o)))throw Error('Выбранные заказы изменились. Закройте список и откройте заново.');SETTINGS=await readSettings();exportJSON(current);await deleteOrders(orders);deleted=true;broadcast();try{await refresh();}catch(e){showError('Заказы удалены, но список не обновился. Перезагрузите страницу. '+e.message);}busy=false;closeDialog(true);toast(`Удалено заказов: ${orders.length}`);
  }catch(e){busy=false;if(!deleted){panel.querySelectorAll('button,input,select').forEach(el=>el.disabled=false);count();$('#cleanup-error').textContent=e.message;$('#cleanup-error').classList.remove('hidden');}}
 };

let BACKUP_STATE={};
function readMeta(key){return new Promise((resolve,reject)=>{const r=idb.transaction('meta').objectStore('meta').get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});}
function writeBackupState(next,expectedToken=null){return new Promise((resolve,reject)=>{const tx=idb.transaction('meta','readwrite'),store=tx.objectStore('meta');let reason='';const r=store.get('backupState');r.onsuccess=()=>{if(expectedToken&&r.result?.pending?.token!==expectedToken){reason='В другой вкладке создана новая копия. Проверьте её сохранение.';tx.abort();return;}store.put({...r.result,...next},'backupState');};tx.oncomplete=resolve;tx.onerror=tx.onabort=()=>reject(Error(reason||'Не удалось сохранить отметку о резервной копии.'));});}
function renderBackupReminder(){
 const panel=$('#backup-reminder');if(!panel)return;const confirmed=BACKUP_STATE.confirmedAt;
 panel.hidden=!loaded||!isOwner()||!SETTINGS.backupReminder||confirmed?.slice(0,10)===today();
 if(!panel.hidden)panel.innerHTML=`<span><strong>Сохраните копию на флешку.</strong> ${confirmed?'Последняя подтверждённая копия: '+esc(fdt(confirmed))+'.':'Данные хранятся только на этом компьютере.'}</span> <button id="backup-reminder-open">Сохранить копию</button>`;
 if($('#backup-reminder-open'))$('#backup-reminder-open').onclick=backup;
}
function renderBackupState(){
 const el=$('#backup-state');if(!el)return;const pending=BACKUP_STATE.pending;
 el.innerHTML=`<p class="help">${BACKUP_STATE.confirmedAt?'Последняя подтверждённая копия: <b>'+esc(fdt(BACKUP_STATE.confirmedAt))+'</b>.':'Подтверждённых копий пока нет.'}</p>${pending?`<div class="warning">Копия ${esc(pending.kind)} от ${esc(fdt(pending.at))} передана браузеру для скачивания. Проверьте, что файл появился в папке загрузок.<p><button id="confirm-backup">Файл сохранился — подтвердить</button></p></div>`:''}`;
 if($('#confirm-backup'))$('#confirm-backup').onclick=async()=>{if(busy)return;const button=$('#confirm-backup');button.disabled=true;try{await writeBackupState({confirmedAt:pending.at,pending:null},pending.token);BACKUP_STATE=await readMeta('backupState')||{};renderBackupState();renderBackupReminder();broadcast();toast('Сохранение резервной копии отмечено');}catch(e){button.disabled=false;const error=$('#backup-error');if(error){error.textContent=e.message;error.classList.remove('hidden');}}};
}
async function backupRequested(kind){
 if(!idb)return;await writeBackupState({pending:{at:nowS(),kind,token:Date.now()+'-'+Math.random().toString(36).slice(2)}});BACKUP_STATE=await readMeta('backupState')||{};renderBackupState();renderBackupReminder();broadcast();
}
const CONTACT_OUTCOMES=['Дозвонился','Не отвечает','Перезвонить','Другое'];
function lastContact(order){return order._contacts?.at(-1)||null;}
function contactSummary(order){const c=lastContact(order);return c?`<div class="muted contact-summary">${esc(fd(c.at))}: ${esc(c.outcome)}${c.next?` · Связаться ${esc(fd(c.next))}`:''}</div>`:'';}
function contactSection(order){return `<section class="section contact-section"><h3>Связь с клиентом</h3>${order._contacts?.length?`<details><summary>История контактов (${order._contacts.length})</summary><div class="history">${order._contacts.slice().reverse().map(c=>`<p><strong>${esc(fdt(c.at))} · ${esc(c.outcome)}</strong>${c.note?`<br><span style="white-space:pre-wrap">${esc(c.note)}</span>`:''}${c.next?`<br>Связаться: ${esc(fd(c.next))}`:''}</p>`).join('')}</div></details>`:'<p class="help">Контактов пока нет.</p>'}<label class="check" style="margin-top:12px"><input type="checkbox" id="contact-add" name="contact-add">Добавить запись о звонке / разговоре</label><div id="contact-fields" hidden><div class="grid"><label>Результат<select id="contact-outcome" name="contact-outcome">${CONTACT_OUTCOMES.map(s=>`<option>${s}</option>`).join('')}</select></label>${F('Связаться снова (необязательно)','contact-next','','date')}${A('О чём договорились','contact-note','')}</div><p class="help">Запись добавится при сохранении заказа. Для обещанной даты получения используйте заметку; дату выше ставьте, если нужно снова связаться.</p></div></section>`;}
function gatherContact(order){
 if(!$('#contact-add')?.checked)return order;const note=get('contact-note'),next=get('contact-next'),outcome=get('contact-outcome');
 if(note.length>4000)throw Error('Заметка о контакте слишком длинная (максимум 4000 символов).');
 if(next&&!validDay(next))throw Error('Проверьте дату следующего контакта.');
 if(!CONTACT_OUTCOMES.includes(outcome))throw Error('Выберите результат контакта.');
 return {...order,_contacts:[...(order._contacts||[]),{at:nowS(),outcome,note,next}]};
}
function validDay(value){if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;const d=new Date(value+'T00:00:00Z');return Number.isFinite(d.getTime())&&d.toISOString().slice(0,10)===value;}
function calendarDays(since,until=today()){const a=String(since||'').slice(0,10);if(!validDay(a)||!validDay(until))return null;return Math.floor((Date.parse(until+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/86400000);}
function staleInfo(order){
 if(order.s==='В')return null;const pickup=order.s==='Г'||order.s==='Б';const start=pickup?(order.r||order.n):order.n;const days=calendarDays(start),threshold=pickup?SETTINGS.pickupDays:SETTINGS.repairDays;
 const contact=lastContact(order),due=!!contact?.next&&contact.next<=today();const stale=days!==null&&days>=threshold;
 if(!stale&&!due)return null;
 return {pickup,days,stale,due,start,fallback:pickup&&!order.r,contact};
}
async function staleDialog(){
 try{await refresh();}catch(e){showError(e.message);return;}if($('#dlg').open)return;
 let limit=100;showDialog(`<div class="dialog-head"><h2 id="dialog-title">Залежавшаяся техника и звонки</h2><button id="xc" class="close" aria-label="Закрыть">×</button></div><div class="dialog-body"><p class="help">В работе — от ${SETTINGS.repairDays} дней с приёма. Готовые и без ремонта — от ${SETTINGS.pickupDays} дней с готовности, а если её дата неизвестна — с приёма. Пороги можно изменить в «Настройки → Журнал». Выданные заказы сюда не попадают.</p><div class="grid"><label>Показать<select id="stale-type"><option value="all">Всё, что требует внимания</option><option value="repair">Долго в работе</option><option value="pickup">Давно ждут получения</option><option value="calls">Пора связаться с клиентом</option></select></label><label>Поиск<input id="stale-query" type="search" placeholder="Номер, техника, клиент или телефон"></label></div><p id="stale-count" class="help" aria-live="polite"></p><div class="table-wrap"><table><thead><tr><th>Заказ</th><th>Техника / статус</th><th>Клиент</th><th>Почему в списке</th><th>Последний контакт</th></tr></thead><tbody id="stale-rows"></tbody></table></div><button id="stale-more">Показать ещё 100</button></div><div class="dialog-actions"><button id="stale-close">Закрыть</button></div>`);
 function draw(){const type=$('#stale-type').value,q=$('#stale-query').value.trim();const rows=visibleOrders(DB).map(o=>({o,info:staleInfo(o)})).filter(({o,info:i})=>i&&(!q||searchMatch(o,q))&&(type==='all'||type==='calls'&&i.due||type==='repair'&&i.stale&&!i.pickup||type==='pickup'&&i.stale&&i.pickup)).sort((a,b)=>Number(b.info.due)-Number(a.info.due)||(b.info.days??-1)-(a.info.days??-1)||a.o.k-b.o.k);
 $('#stale-count').textContent=`Найдено: ${rows.length}. Показано: ${Math.min(limit,rows.length)}. Нажмите номер, чтобы открыть карточку и записать звонок.`;
 $('#stale-rows').innerHTML=rows.slice(0,limit).map(({o,info:i})=>`<tr><td><button class="order-link" data-stale-id="${o.k}">№${o.k}</button></td><td><strong>${esc(o.m||'—')}</strong><div class="muted">${esc(names[o.s])}</div></td><td>${esc(o.c||'Имя не указано')}<div>${esc(o.t||'Телефон не указан')}</div></td><td>${i.stale?`${i.days} дн. ${i.pickup?'ждёт получения':'с приёма'}${i.fallback?'<div class="muted">Дата готовности неизвестна — считаем с приёма</div>':''}`:''}${i.due?`<div class="late">Связаться ${esc(fd(i.contact.next))}</div>`:''}</td><td>${i.contact?`${esc(fdt(i.contact.at))} · ${esc(i.contact.outcome)}<div style="white-space:pre-wrap">${esc(i.contact.note)}</div>`:'Ещё не записан'}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">По этим условиям заказов нет.</td></tr>';$('#stale-more').hidden=rows.length<=limit;}
 $('#stale-type').onchange=()=>{limit=100;draw();};$('#stale-query').oninput=()=>{limit=100;draw();};$('#stale-more').onclick=()=>{limit+=100;draw();};$('#stale-close').onclick=()=>closeDialog();
 $('#stale-rows').onclick=e=>{const b=e.target.closest('[data-stale-id]');if(!b)return;const order=DB.find(o=>o.k===Number(b.dataset.staleId));closeDialog(true);if(order)card(order);};draw();
}

async function importRecords(records,update,expected,incomingSettings=null,expectedSettings=null,replace=false,incomingLast=0){await authorizeLocal('owner');return new Promise((resolve,reject)=>{const tx=idb.transaction(['orders','meta'],'readwrite'),store=tx.objectStore('orders');let added=0,updated=0,removed=0,reason='';const metaStore=tx.objectStore('meta'),high=metaStore.get('lastOrderNumber');high.onsuccess=()=>{const imported=Number.isSafeInteger(incomingLast)&&incomingLast>=0?incomingLast:0;metaStore.put(records.reduce((m,o)=>Math.max(m,o.k),Math.max(Number(high.result)||0,LAST_ORDER_NUMBER,imported)),'lastOrderNumber');};if(incomingSettings){const meta=tx.objectStore('meta'),settingsRequest=meta.get('settings');settingsRequest.onsuccess=()=>{if(JSON.stringify(settingsRequest.result)!==JSON.stringify(expectedSettings)){reason='Настройки изменились в другой вкладке. Повторите импорт.';tx.abort();return;}meta.put(incomingSettings,'settings');};}const req=store.getAll();req.onsuccess=()=>{if(JSON.stringify(req.result)!==JSON.stringify(expected)){reason='База изменилась в другой вкладке. Повторите импорт, чтобы сохранить актуальную копию.';tx.abort();return;}const map=new Map(req.result.map(x=>[x.k,x]));if(replace){const incomingIds=new Set(records.map(x=>x.k));for(const old of req.result){if(!incomingIds.has(old.k)){store.delete(old.k);removed++;}}}records.forEach(x=>{const old=map.get(x.k);if(!old||update||replace){store.put({...x,_id:x._id||old?._id||localUUID(),_rev:(Number(old?._rev)||0)+1,_updated:nowS()});old?updated++:added++;}});};tx.oncomplete=()=>resolve({added,updated,removed});tx.onerror=tx.onabort=()=>reject(new Error(reason||'Импорт не выполнен: ошибка хранилища. Текущая база сохранена.'));});}

async function enableClassicRowColors(){return new Promise((resolve,reject)=>{

});}
async function start(){const seed=validateRecords(JSON.parse($('#seed').textContent));DB=seed;cur=SETTINGS.defaultTab;applySettings();updateClock();render();try{idb=await openDB('scm3-'+dataset);let initial=seed,legacyUsed=false,legacy;
 if($('#seed').dataset.legacy==='true'){try{legacy=await openDB('scm2',true);if(legacy&&legacy.objectStoreNames.contains('o')){const old=await getAll(legacy,'o');if(old.length){initial=validateRecords(old);legacyUsed=true;}}}catch{ $('#notice').textContent='Старую локальную базу прочитать не удалось. Использованы записи из приложенного файла. Если в старой программе есть более новые заказы, сначала перенесите их.';}finally{legacy?.close();}}

 }catch(e){loaded=false;idb=null;$('#new').disabled=true;showError('Локальное сохранение недоступно. Режим просмотра: новые изменения не принимаются. Откройте файл в обычном окне Edge или Chrome. '+e.message);$('#storage').textContent='Просмотр встроенной базы · Для сохранения требуется доступное хранилище браузера.';}
}
