<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="290" viewBox="0 0 1120 290" role="img" aria-labelledby="title desc"><title id="title">Мастерская</title><desc id="desc">Каждый ремонт на своём месте. Программа учёта ремонта техники.</desc><rect width="1120" height="290" rx="20" fill="#244b3c"/><circle cx="1050" cy="25" r="215" fill="#2e5745"/><circle cx="1080" cy="290" r="115" fill="#365e49"/><rect x="54" y="48" width="47" height="47" rx="4" fill="none" stroke="#dbec91"/><text x="64" y="82" fill="#dbec91" font-family="Georgia,serif" font-size="34">М</text><text x="120" y="82" fill="#d9e5d6" font-family="Arial,sans-serif" font-size="17" letter-spacing="2">УЧЁТ РЕМОНТА ТЕХНИКИ</text><text x="54" y="168" fill="#fffdf6" font-family="Arial,sans-serif" font-weight="600" font-size="64">Мастерская</text><text x="56" y="222" fill="#dbec91" font-family="Arial,sans-serif" font-size="29">Каждый ремонт на своём месте.</text><g transform="translate(859 60) rotate(8 84 85)"><rect width="160" height="180" rx="7" fill="#f8f7f2"/><path d="M25 43h110M25 73h85M25 103h110" stroke="#b7c4b0" stroke-width="5" stroke-linecap="round"/><rect x="23" y="130" width="112" height="29" rx="4" fill="#dbec91"/><path d="m48 143 8 8 17-17" fill="none" stroke="#244b3c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></svg>