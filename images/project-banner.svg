<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="310" viewBox="0 0 1120 310" role="img" aria-labelledby="title desc"><title id="title">Мастерская — каждый ремонт на своём месте</title><desc id="desc">Учёт ремонта техники на компьютере и телефоне.</desc><rect x=".5" y=".5" width="1119" height="309" rx="16" fill="#fafaf7" stroke="#dfe5df"/><rect x="48" y="40" width="40" height="40" rx="9" fill="#365b49"/><path d="M58 69V50l10 13 10-13v19" fill="none" stroke="#fafaf7" stroke-width="2.7" stroke-linejoin="round"/><text x="104" y="65" fill="#617168" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">УЧЁТ РЕМОНТА ТЕХНИКИ</text><text x="48" y="164" fill="#263b33" font-family="Arial,sans-serif" font-weight="500" font-size="60" letter-spacing="-2">Мастерская</text><text x="50" y="213" fill="#68806a" font-family="Arial,sans-serif" font-size="27">Каждый ремонт на своём месте.</text><text x="50" y="267" fill="#617168" font-family="Arial,sans-serif" font-size="12">НА КОМПЬЮТЕРЕ И ТЕЛЕФОНЕ</text><g transform="translate(731 48)"><rect width="340" height="214" rx="10" fill="white" stroke="#dfe5df"/><circle cx="22" cy="23" r="3.5" fill="#91a781"/><text x="35" y="27" fill="#617168" font-family="Arial,sans-serif" font-size="11">Журнал мастерской</text><path d="M0 45h340M20 95h300M20 142h300" fill="none" stroke="#e4e9df"/><g font-family="Arial,sans-serif" font-size="12" fill="#263b33"><text x="20" y="75">Приём техники</text><text x="20" y="123">Работы и запчасти</text><text x="20" y="170">Готовность и выдача</text></g><g fill="#edf2e8"><rect x="246" y="59" width="70" height="24" rx="4"/><rect x="246" y="107" width="70" height="24" rx="4"/><rect x="246" y="154" width="70" height="24" rx="4"/></g><g fill="#4b6750" font-family="Arial,sans-serif" font-size="10" text-anchor="middle"><text x="281" y="75">Принят</text><text x="281" y="123">В работе</text><text x="281" y="170">Готов</text></g></g></svg>